name: ci

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Unit tests (JVM / Wasm)
        working-directory: kmp
        run: ./gradlew :shared:jvmTest :shared:wasmJsNodeTest --console=plain

  wasm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Wasm distribution
        working-directory: kmp
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --console=plain
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: kmp/composeApp/build/dist/wasmJs/productionExecutable

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        working-directory: kmp
        run: ./gradlew :composeApp:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: composeApp-debug.apk
          path: kmp/composeApp/build/outputs/apk/debug/composeApp-debug.apk

  deploy:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
