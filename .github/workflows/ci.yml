name: ci

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Unit tests (JVM / Wasm)
        working-directory: kmp
        run: ./gradlew :shared:jvmTest :shared:wasmJsNodeTest --console=plain

  wasm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Wasm distribution
        working-directory: kmp
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --console=plain
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: kmp/composeApp/build/dist/wasmJs/productionExecutable

  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        working-directory: kmp
        run: ./gradlew :composeApp:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: composeApp-debug.apk
          path: kmp/composeApp/build/outputs/apk/debug/composeApp-debug.apk

      - name: Assemble release
        if: env.SIGNING_KEY != ''
        working-directory: kmp
        run: ./gradlew :composeApp:assembleRelease --console=plain

      - name: Sign release APK
        if: env.SIGNING_KEY != ''
        run: |
          echo "$SIGNING_KEY" | base64 --decode > release.jks
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -n 1)
          UNSIGNED=$(ls kmp/composeApp/build/outputs/apk/release/*-unsigned.apk | head -1)
          "$BUILD_TOOLS_DIR/apksigner" sign --ks release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" --out kmp/composeApp/build/outputs/apk/release/open-yaske-release.apk "$UNSIGNED"

      - uses: actions/upload-artifact@v4
        if: env.SIGNING_KEY != ''
        with:
          name: open-yaske-release.apk
          path: kmp/composeApp/build/outputs/apk/release/open-yaske-release.apk

  deploy:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
